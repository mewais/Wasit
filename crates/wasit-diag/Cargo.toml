[package]
name = "wasit-diag"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Content-free diagnostics: typed event declarations, the value types they may carry, the free-text scrubber, and the one bounded, never-blocking sink per process"

[features]
default = ["tracing"]
# The counts-only `tracing` bridge (`tracing_layer()`): records `trace.counted` per minute,
# never a message or a field value.
tracing = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
sha2 = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
wasit-process = { path = "../wasit-process", default-features = false }
