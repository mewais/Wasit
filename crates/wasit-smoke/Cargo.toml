[package]
name = "wasit-smoke"
version = "0.1.0"
edition = "2021"
description = "Manual live-smoke binary: drive a real claude/codex/opencode CLI through Wasit drivers and watch the AgentEvent stream."

[[bin]]
name = "wasit-smoke"
path = "src/main.rs"

[dependencies]
wasit-core = { path = "../wasit-core" }
wasit-claude = { path = "../wasit-claude" }
wasit-codex = { path = "../wasit-codex" }
wasit-opencode = { path = "../wasit-opencode" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time"] }
serde_json = "1"
