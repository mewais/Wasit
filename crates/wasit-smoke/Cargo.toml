[package]
name = "wasit-smoke"
version = "0.1.0"
edition = "2021"
description = "Manual harness: drive a real agent CLI through its Wasit Protocol, print events, answer gates, record transcripts."

[[bin]]
name = "wasit-smoke"
path = "src/main.rs"

[dependencies]
wasit-core = { path = "../wasit-core" }
wasit-claude = { path = "../wasit-claude" }
wasit-codex = { path = "../wasit-codex" }
wasit-opencode = { path = "../wasit-opencode" }
tokio = { workspace = true }
serde_json = { workspace = true }

[lib]
name = "wasit_smoke"
path = "src/lib.rs"
