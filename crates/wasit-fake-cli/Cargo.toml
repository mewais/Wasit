[package]
name = "wasit-fake-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Scriptable fake agent CLI speaking the real claude / codex / opencode / kilo wire protocols, for tests"

[lib]
name = "wasit_fake_cli"
path = "src/lib.rs"

[[bin]]
name = "wasit-fake-cli"
path = "src/main.rs"

[dependencies]
wasit-process = { path = "../wasit-process", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = { workspace = true }
regex = "1"
