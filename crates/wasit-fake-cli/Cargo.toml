[package]
name = "wasit-fake-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Scriptable fake agent CLI speaking the real claude / codex / opencode / kilo wire protocols, for tests"

[lib]
name = "wasit_fake_cli"
path = "src/lib.rs"

[[bin]]
name = "wasit-fake-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
