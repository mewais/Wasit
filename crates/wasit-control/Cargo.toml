[package]
name = "wasit-control"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Wasit control protocol: wire types, framing, client, server, link supervisor and router"

[features]
# TypeScript definitions of the wire types (ts-rs), for GUI clients.
ts = ["dep:ts-rs"]

[dependencies]
wasit-process = { path = "../wasit-process" }
wasit-diag = { path = "../wasit-diag", default-features = false }
ts-rs = { version = "12", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
fastrand = "2"

[[bin]]
name = "wasit-control-demo"
path = "src/bin/wasit-control-demo.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
