[package]
name = "wasit-process"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The one place Wasit, Wasl and Marsad create child processes: no console windows on Windows, detached launches, console-output decoding"

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[dependencies]
tokio = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }
